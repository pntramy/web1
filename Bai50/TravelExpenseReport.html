<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DeLong Enterprises - Travel Expense Report</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="form-container">
        
        <header class="header-logo">
            <img src="DeLong.jpg" alt="DeLong Enterprises Logo" class="logo-img">
        </header>

        <section class="form-header">
            <h2>Travel Expense Report</h2>
            <hr class="header-line">
        </header>

        <form id="expenseReportForm" onsubmit="handleSubmit(event)">

            <div class="form-row">
                <label class="section-title">1) First Name:</label>
                <input type="text" name="firstName" class="input-name">
                <label class="section-title inline-label">Last Name:</label>
                <input type="text" name="lastName" class="input-name">
            </div>

            <div class="form-row">
                <label class="section-title">2) Social Security Number:</label>
                <input type="text" name="ssn" class="input-ssn">
            </div>

            <div class="form-row">
                <label class="section-title">3) Department:</label>
                <select name="department" class="select-dept">
                    <option value="Accounting">Accounting</option>
                    <option value="Marketing">Marketing</option>
                    <option value="HumanResources">Human Resources</option>
                    <option value="Production">Production</option>
                </select>
            </div>

            <div class="form-section">
                <label class="section-title block-title">4) Describe the purpose of your trip.</label>
                <textarea name="purpose" rows="4" class="textarea-purpose"></textarea>
            </div>

            <div class="form-section">
                <label class="section-title block-title">5) Itemize your travel expenses</label>
                
                <table class="expense-table">
                    <thead>
                        <tr>
                            <th class="col-date">Date</th>
                            <th class="col-desc">Description</th>
                            <th class="col-cate">Category</th>
                            <th class="col-amount">Amount</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr>
                            <td><input type="text" name="date1" placeholder="mm/dd/yy" class="tbl-input text-center"></td>
                            <td><input type="text" name="desc1" class="tbl-input"></td>
                            <td>
                                <select name="cate1" class="tbl-select">
                                    <option value="Meal">Meal</option>
                                    <option value="Lodging">Lodging</option>
                                    <option value="Transport">Transport</option>
                                </select>
                            </td>
                            <td><input type="text" name="amount1" class="tbl-input"></td>
                        </tr>
                        <tr>
                            <td><input type="text" name="date2" placeholder="mm/dd/yy" class="tbl-input text-center"></td>
                            <td><input type="text" name="desc2" class="tbl-input"></td>
                            <td>
                                <select name="cate2" class="tbl-select">
                                    <option value="Meal">Meal</option>
                                    <option value="Lodging">Lodging</option>
                                    <option value="Transport">Transport</option>
                                </select>
                            </td>
                            <td><input type="text" name="amount2" class="tbl-input"></td>
                        </tr>
                        <tr>
                            <td><input type="text" name="date3" placeholder="mm/dd/yy" class="tbl-input text-center"></td>
                            <td><input type="text" name="desc3" class="tbl-input"></td>
                            <td>
                                <select name="cate3" class="tbl-select">
                                    <option value="Meal">Meal</option>
                                    <option value="Lodging">Lodging</option>
                                    <option value="Transport">Transport</option>
                                </select>
                            </td>
                            <td><input type="text" name="amount3" class="tbl-input"></td>
                        </tr>
                        <tr>
                            <td><input type="text" name="date4" placeholder="mm/dd/yy" class="tbl-input text-center"></td>
                            <td><input type="text" name="desc4" class="tbl-input"></td>
                            <td>
                                <select name="cate4" class="tbl-select">
                                    <option value="Meal">Meal</option>
                                    <option value="Lodging">Lodging</option>
                                    <option value="Transport">Transport</option>
                                </select>
                            </td>
                            <td><input type="text" name="amount4" class="tbl-input"></td>
                        </tr>
                    </tbody>
                </table>
            </div>

            <div class="form-row margin-bottom-lg">
                <label class="section-title">6) Have you submitted your receipts?</label>
                <label class="radio-label"><input type="radio" name="receipts" value="Yes"> Yes</label>
                <label class="radio-label"><input type="radio" name="receipts" value="No"> No</label>
            </div>

            <div class="buttons-group">
                <button type="submit" class="btn-ctrl">Submit travel expenses</button>
                <button type="button" class="btn-ctrl" onclick="handleReset()">Reset</button>
            </div>

            <footer class="form-footer">
                <p>Questions? Contact Debbie Larson in Accounting (ext. 2150).</p>
            </footer>

        </form>

    </div>

    <script>
        // Khi nhấn Submit -> Hiện thông báo alert
        function handleSubmit(event) {
            event.preventDefault(); // Chống tải lại trang mặc định
            alert("Báo cáo chi phí của bạn đã được submit thành công!");
        }

        // Khi nhấn Reset -> Xóa dữ liệu các ô về ban đầu
        function handleReset() {
            document.getElementById("expenseReportForm").reset();
        }
    </script>

</body>
</html>
